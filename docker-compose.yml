services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4001:3001"
    volumes:
      - ./backend/src:/app/src
      - ./data:/app/data
      - ./exports:/app/exports
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DB_PATH=/app/data/manga.db
      - EXPORTS_PATH=/app/exports
      # El cron usa hora local (07:00); fijar la zona es crítico.
      - TZ=Europe/Madrid
      # El valor real vive en .env (fuera de git): este fichero está publicado
      # en GitHub y quien tenga la URL puede publicar en el canal.
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_SEND_DELAY_MS=${DISCORD_SEND_DELAY_MS:-1500}
      - DISCORD_MAX_EMBEDS_PER_RUN=${DISCORD_MAX_EMBEDS_PER_RUN:-30}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4000:80"
    environment:
      - TZ=Europe/Madrid
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
